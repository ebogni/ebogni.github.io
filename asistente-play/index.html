<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asistente de Play Console</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f1ea;color:#222;margin:0}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{margin:0 0 4px}.sub{color:#666;margin:0 0 16px}
select{font:inherit;padding:8px;border-radius:10px}
.barra{height:10px;background:#ddd;border-radius:5px;margin:14px 0 20px;overflow:hidden}.barra i{display:block;height:100%;background:#3e8e41;width:0}
.paso{background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:6px solid #c23d2a}
.paso.hecho{opacity:.55;border-left-color:#3e8e41}.paso.actual{outline:3px solid #c23d2a}
.cab{display:flex;align-items:center;gap:10px}.cab h2{flex:1;margin:0;font-size:19px}
.num{width:30px;height:30px;border-radius:50%;background:#c23d2a;color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0}.hecho .num{background:#3e8e41}
.donde{color:#555;font-size:14px;margin:6px 0 10px}.donde b{color:#222}
.campo{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid #eee}
.campo .et{width:190px;flex-shrink:0;font-size:13px;font-weight:700;color:#555}
.campo .val{flex:1;white-space:pre-wrap;font-size:14px;word-break:break-word}
.campo button,.listo{border:0;border-radius:10px;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer}
.campo button{background:#efe7da}.campo button.ok{background:#3e8e41;color:#fff}
.nota{background:#fff7e0;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.listo{background:#c23d2a;color:#fff;margin-top:12px}.hecho .listo{background:#999}
@media(max-width:600px){.campo{flex-direction:column}.campo .et{width:auto}}
</style></head>
<body><main>
<h1>Asistente de Play Console</h1>
<p class="sub">Los pasos que hay que hacer a mano en Google Play, de a uno, con los textos listos para copiar. No gasta nada: es solo esta página. Tu avance queda guardado en este navegador.</p>
<label>App: <select id="app"></select></label> <button id="reiniciar" style="margin-left:8px">Empezar de nuevo</button>
<div class="barra"><i id="progreso"></i></div>
<div id="pasos"></div>
</main>
<script src="datos.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let clave = localStorage.getItem('asistente-app') || Object.keys(APPS)[0];
$('app').innerHTML = Object.entries(APPS).map(([k, a]) => `<option value="${k}" ${k === clave ? 'selected' : ''}>${esc(a.nombre)} (${esc(a.paquete)})</option>`).join('');
const hechos = () => JSON.parse(localStorage.getItem('asistente-' + clave) || '[]');
function pintar() {
  const a = APPS[clave], h = hechos(), actual = a.pasos.findIndex((_, i) => !h.includes(i));
  $('progreso').style.width = (100 * h.length / a.pasos.length) + '%';
  $('pasos').innerHTML = a.pasos.map((p, i) => `<div class="paso ${h.includes(i) ? 'hecho' : ''} ${i === actual ? 'actual' : ''}" id="paso-${i}">
    <div class="cab"><span class="num">${h.includes(i) ? '✓' : i + 1}</span><h2>${esc(p.titulo)}</h2></div>
    ${p.bloque ? `<div class="donde" style="margin-bottom:0">${esc(p.bloque)}</div>` : ''}<div class="donde">Dónde: <b>${esc(p.donde)}</b></div>
    ${p.campos.map(([et, val, copiar], j) => `<div class="campo"><div class="et">${esc(et)}</div><div class="val">${esc(val)}</div>${copiar === false ? '' : `<button data-copiar="${i}-${j}">Copiar</button>`}</div>`).join('')}
    ${p.nota ? `<div class="nota">${esc(p.nota)}</div>` : ''}
    <button class="listo" data-listo="${i}">${h.includes(i) ? 'Volver a marcar como pendiente' : 'Listo, siguiente'}</button></div>`).join('');
  if (actual >= 0) document.getElementById('paso-' + actual).scrollIntoView({ block: 'center' });
}
document.addEventListener('click', async e => {
  const c = e.target.closest('[data-copiar]');
  if (c) { const [i, j] = c.dataset.copiar.split('-').map(Number); await navigator.clipboard.writeText(APPS[clave].pasos[i].campos[j][1]); c.textContent = '¡Copiado!'; c.classList.add('ok'); setTimeout(() => { c.textContent = 'Copiar'; c.classList.remove('ok'); }, 1500); }
  const l = e.target.closest('[data-listo]');
  if (l) { const i = +l.dataset.listo; let h = hechos(); h = h.includes(i) ? h.filter(x => x !== i) : [...h, i]; localStorage.setItem('asistente-' + clave, JSON.stringify(h)); pintar(); }
});
$('app').addEventListener('change', () => { clave = $('app').value; localStorage.setItem('asistente-app', clave); pintar(); });
$('reiniciar').addEventListener('click', () => { if (confirm('¿Borrar el avance de esta app?')) { localStorage.removeItem('asistente-' + clave); pintar(); } });
pintar();
</script>
</body></html>
