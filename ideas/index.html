<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161d">
<title>Almacén de ideas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<style>
:root{--bg:#14161d;--card:#1e212b;--card2:#272b38;--tx:#eef0f6;--mu:#9aa1b3;--bd:#2e3342;--oro:#ffc53d;--verde:#3ecf7a;--amar:#f5b942;--rojo:#ff6257;--azul:#6ea8ff;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(90px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));max-width:1100px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header h1{font-size:1.35em;margin:0;flex:1}
.nota{color:var(--mu);font-size:.85em;margin:0 0 10px}
.aviso{background:#3a2f12;border:1px solid #6b5520;color:#ffe2a0;border-radius:12px;padding:10px 12px;font-size:.9em;margin-bottom:12px}
.nueva{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px;margin-bottom:14px}
.nueva input,.nueva textarea,.buscar{width:100%;background:transparent;border:0;color:var(--tx);font:inherit;outline:none;resize:none}
.nueva input{font-weight:650;font-size:1.05em;margin-bottom:6px}
.nueva textarea{min-height:64px}
.nueva .pie{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
button{font:inherit;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;background:var(--card2);color:var(--tx)}
button.pri{background:var(--oro);color:#1b1500;font-weight:700}
button:disabled{opacity:.5;cursor:default}
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.buscar{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:9px 14px;flex:1 1 180px;width:auto}
.grilla{columns:280px;column-gap:12px}
.idea{break-inside:avoid;background:var(--card);border:1px solid var(--bd);border-top:5px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin:0 0 12px;display:block;width:100%}
.idea h3{margin:0 0 4px;font-size:1.03em}
.cat{display:inline-block;font-size:.75em;font-weight:700;color:#1b1500;background:var(--oro);border-radius:999px;padding:2px 9px;margin-bottom:6px}
.chip{padding:7px 12px;font-size:.88em;border:1px solid var(--bd);background:transparent;color:var(--mu)}.chip.on{background:var(--card2);color:var(--tx);border-color:#454b5e}
.nueva select{background:var(--card2);color:var(--tx);border:0;border-radius:999px;padding:8px 12px;font:inherit;flex:1 1 auto;min-width:0;max-width:60%;margin-right:auto}
.idea .txt{white-space:pre-wrap;overflow-wrap:anywhere;color:#d9dce6;font-size:.95em}
.idea .fecha{color:var(--mu);font-size:.78em;margin-top:6px}
.viable .acc{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.acc button{padding:6px 12px;font-size:.85em}
.vacio{color:var(--mu);text-align:center;padding:30px 10px}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:var(--r);max-width:420px;width:calc(100% - 30px)}
dialog::backdrop{background:#000a}
</style>
</head>
<body>
<header><h1>💡 Almacén de ideas</h1></header>
<p class="nota" id="estado">Cargando tus ideas…</p>
<div class="aviso" id="aviso" hidden></div>

<form class="nueva" id="fNueva">
  <input id="titulo" placeholder="Título (opcional)" maxlength="120" autocomplete="off">
  <textarea id="texto" placeholder="Anotá la idea…" maxlength="4000"></textarea>
  <div class="pie"><select id="categoria" aria-label="Categoría"></select><button type="button" id="btnLimpiar">Borrar</button><button class="pri" id="btnGuardar">Guardar</button></div>
</form>

<div class="barra">
  <input class="buscar" id="buscar" placeholder="🔎 Buscar…" autocomplete="off">
</div>
<div class="barra" id="cats">
</div>
<div class="grilla" id="grilla"></div>

<dialog id="dlgCat"><form><p>Nombre de la categoría nueva</p><input id="dlgCatNombre" maxlength="40" autocomplete="off" style="width:100%;background:var(--card2);color:var(--tx);border:0;border-radius:10px;padding:10px;font:inherit"><div class="acc" style="justify-content:flex-end"><button type="button" id="dlgCatNo">Cancelar</button><button class="pri" id="dlgCatSi">Crear</button></div></form></dialog>
<dialog id="dlg"><p id="dlgTxt"></p><div class="acc" style="justify-content:flex-end"><button id="dlgNo">Cancelar</button><button class="pri" id="dlgSi">Borrar</button></div></dialog>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let IDEAS = [], texto = '', filtroCat = '';
const LSC = 'almacen-ideas-categorias';
let CATS = (() => { try { return JSON.parse(localStorage.getItem(LSC)) || null; } catch (e) { return null; } })() || ['Apps', 'Juegos', 'Diseños 3D', 'MundoLEDs', 'Casa y domótica', 'Otras'];
const guardarCats = () => { try { localStorage.setItem(LSC, JSON.stringify(CATS)); } catch (e) { } };
let col = null, local = false;

// ---------- Guardado: en tu cuenta (privado) o, si no se puede, en este navegador ----------
const LS = 'almacen-ideas';
const leerLocal = () => { try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch (e) { return []; } };
const guardarLocal = () => { try { localStorage.setItem(LS, JSON.stringify(IDEAS)); } catch (e) { } };
async function guardar(idea) {
  if (local) { const i = IDEAS.findIndex(x => x.id === idea.id); if (i >= 0) IDEAS[i] = idea; else IDEAS.push(idea); guardarLocal(); pintar(); return; }
  await col.doc(idea.id).set(idea);
}
async function borrar(id) {
  if (local) { IDEAS = IDEAS.filter(x => x.id !== id); guardarLocal(); pintar(); return; }
  await col.doc(id).delete();
}


// ---------- Pantalla ----------
function avisar(t) { $('aviso').textContent = t; $('aviso').hidden = !t; }
const fecha = iso => new Date(iso).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: '2-digit' });
function pintarCats() {
  const usadas = [...new Set(IDEAS.map(x => x.categoria).filter(Boolean))];
  for (const c of usadas) if (!CATS.includes(c)) CATS.push(c);
  const sel = $('categoria'), elegida = sel.value || CATS[0];
  sel.innerHTML = CATS.map(c => `<option${c === elegida ? ' selected' : ''}>${esc(c)}</option>`).join('') + '<option value="__nueva">➕ Nueva categoría…</option>';
  const cuenta = c => IDEAS.filter(x => (x.categoria || 'Otras') === c).length;
  $('cats').innerHTML = `<button class="chip${filtroCat ? '' : ' on'}" data-c="">Todas (${IDEAS.length})</button>` + CATS.filter(c => cuenta(c)).map(c => `<button class="chip${filtroCat === c ? ' on' : ''}" data-c="${esc(c)}">${esc(c)} (${cuenta(c)})</button>`).join('');
}
function pintar() {
  pintarCats();
  let L = IDEAS.slice().sort((a, b) => b.creada.localeCompare(a.creada));
  if (filtroCat) L = L.filter(x => (x.categoria || 'Otras') === filtroCat);
  if (texto) { const q = texto.toLowerCase(); L = L.filter(x => (x.titulo + ' ' + x.texto + ' ' + (x.categoria || '')).toLowerCase().includes(q)); }
  $('grilla').innerHTML = L.length ? L.map(x => `<article class="idea">
      <span class="cat">${esc(x.categoria || 'Otras')}</span>
      ${x.titulo ? `<h3>${esc(x.titulo)}</h3>` : ''}<div class="txt">${esc(x.texto)}</div>
      <div class="fecha">Anotada el ${fecha(x.creada)}</div>
      <div class="acc"><button data-ed="${x.id}">✏️ Editar</button><button data-bo="${x.id}">🗑️</button></div>
    </article>`).join('') : `<div class="vacio">${IDEAS.length ? 'Ninguna idea coincide con la búsqueda.' : 'Todavía no anotaste ninguna idea. Escribila arriba y tocá "Guardar".'}</div>`;
}

let editando = null;
$('fNueva').addEventListener('submit', async e => {
  e.preventDefault();
  const t = $('texto').value.trim(), ti = $('titulo').value.trim();
  if (!t && !ti) { $('texto').focus(); return; }
  const base = editando ? IDEAS.find(x => x.id === editando) : null;
  const cat = $('categoria').value === '__nueva' ? 'Otras' : $('categoria').value;
  const idea = base ? { ...base, titulo: ti, texto: t || ti, categoria: cat } : { categoria: cat, id: 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), titulo: ti, texto: t || ti, creada: new Date().toISOString() };
  $('btnGuardar').disabled = true;
  try { await guardar(idea); $('titulo').value = ''; $('texto').value = ''; editando = null; $('btnGuardar').textContent = 'Guardar'; avisar(''); }
  catch (err) { avisar(err && err.code === 'quota_exceeded' ? 'Se llenó el almacén: borrá algunas ideas viejas.' : 'No se pudo guardar. Probá de nuevo.'); }
  finally { $('btnGuardar').disabled = false; }
});
$('btnLimpiar').onclick = () => { $('titulo').value = ''; $('texto').value = ''; editando = null; $('btnGuardar').textContent = 'Guardar'; };
$('buscar').oninput = e => { texto = e.target.value.trim(); pintar(); };
let aBorrar = null;
$('grilla').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const idea = IDEAS.find(x => x.id === (b.dataset.ed || b.dataset.bo)); if (!idea) return;
  if (b.dataset.ed) { editando = idea.id; $('titulo').value = idea.titulo; $('categoria').value = idea.categoria || 'Otras'; $('texto').value = idea.texto; $('btnGuardar').textContent = 'Guardar cambios'; window.scrollTo({ top: 0, behavior: 'smooth' }); $('texto').focus(); }
  if (b.dataset.bo) { aBorrar = idea.id; $('dlgTxt').textContent = '¿Borrar "' + (idea.titulo || idea.texto.slice(0, 60)) + '"? No se puede deshacer.'; $('dlg').showModal(); }
};
$('dlgNo').onclick = () => $('dlg').close();
$('dlgSi').onclick = async () => { $('dlg').close(); try { await borrar(aBorrar); } catch (e) { avisar('No se pudo borrar. Probá de nuevo.'); } };

// ---------- Arranque ----------
// Categorías: filtrar tocando un botón, crear una nueva desde la lista
$('cats').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; filtroCat = b.dataset.c; pintar(); };
$('categoria').onchange = () => {
  if ($('categoria').value !== '__nueva') return;
  $('dlgCatNombre').value = ''; $('dlgCat').showModal(); $('dlgCatNombre').focus();
};
$('dlgCatNo').onclick = () => { $('dlgCat').close(); $('categoria').value = CATS[0]; };
$('dlgCatSi').onclick = e => {
  e.preventDefault();
  let n = $('dlgCatNombre').value.trim(); if (!n) return;
  n = n[0].toUpperCase() + n.slice(1);
  if (!CATS.includes(n)) { CATS.push(n); guardarCats(); }
  $('dlgCat').close(); pintarCats(); $('categoria').value = n;
};
function modoLocal(motivo) {
  local = true; IDEAS = leerLocal();
  $('estado').textContent = 'Guardando solo en este navegador.';
  if (motivo) avisar(motivo);
  pintar();
}
modoLocal();
$('estado').textContent = 'Tus ideas se guardan en este celu.';
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
