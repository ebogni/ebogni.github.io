name: Tablero
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: tablero, cancel-in-progress: false }
jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Juntar datos y cifrarlos
        working-directory: tablero-recolector
        env:
          TABLERO_CLAVE: ${{ secrets.TABLERO_CLAVE }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADMOB_REFRESH_TOKEN: ${{ secrets.ADMOB_REFRESH_TOKEN }}
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
          CULTS_KEY: ${{ secrets.CULTS_KEY }}
        run: |
          npm install --silent --no-audit --no-fund
          node recolectar.mjs
      - name: Publicar
        run: |
          git config user.name "Tablero VikingZone"; git config user.email "ebogni@users.noreply.github.com"
          git add tablero/datos.json tablero/estado.json
          git diff --cached --quiet && exit 0
          git commit -qm "Tablero: datos nuevos"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
