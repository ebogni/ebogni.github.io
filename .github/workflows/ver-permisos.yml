name: Ver permisos de Google
# Muestra QUÉ permisos tiene el token de Google guardado (nunca el token). Deja el resultado en la rama "diagnostico".
on: workflow_dispatch
permissions:
  contents: write
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - env:
          ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          SEC: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REF: ${{ secrets.ADMOB_REFRESH_TOKEN }}
        run: |
          mkdir out && cd out
          [ -z "$ID" ] && ID="740201206532-mjnmfn73ll62k6m190dntq4cqng1hlid.apps.googleusercontent.com"
          TOK=$(curl -s https://oauth2.googleapis.com/token -d client_id="$ID" -d client_secret="$SEC" -d refresh_token="$REF" -d grant_type=refresh_token | python3 -c 'import sys,json;print(json.load(sys.stdin).get("access_token",""))')
          if [ -z "$TOK" ]; then echo "sin token" > permisos.txt; else curl -s "https://oauth2.googleapis.com/tokeninfo?access_token=$TOK" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("\n".join(d.get("scope","").split()))' > permisos.txt; fi
          date -u >> permisos.txt
          git init -q && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git checkout -q -b diagnostico && git add -A && git commit -qm permisos && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" diagnostico
