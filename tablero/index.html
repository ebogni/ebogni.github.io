<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tablero VikingZone</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="theme-color" content="#101218">
<style>
:root{--bg:#101218;--card:#1a1d26;--card2:#222633;--tx:#eef0f6;--mu:#9299ab;--bd:#2a2e3b;--oro:#ffc53d;--sube:#3ecf7a;--baja:#ff6257;--azul:#6ea8ff;--r:18px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:1900px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) clamp(12px,3vw,28px) 40px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 4px}h1{font-size:clamp(1.25em,2.4vw,1.6em);margin:0;flex:1;letter-spacing:.2px}
.ctrl{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:8px 13px;font:inherit;cursor:pointer}
.ctrl:hover{background:var(--card2)}
.estado{color:var(--mu);font-size:.85em;margin:0 0 14px}
.aviso{border-radius:14px;padding:10px 14px;font-size:.92em;margin-bottom:10px;display:flex;gap:8px}
.aviso.amarillo{background:#3a3115;border:1px solid #6d5a1d;color:#ffe6a3}.aviso.rojo{background:#3a1b1b;border:1px solid #6b2a2a;color:#ffd0cc}
/* Números grandes */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,155px),1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .t{color:var(--mu);font-size:.85em;display:flex;gap:6px;align-items:center}
.kpi .v{font-size:clamp(1.45em,4.2vw,2.3em);font-weight:750;line-height:1.1;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--mu);font-size:.85em}
.barra{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:6px}.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--oro),#ff9f1c);border-radius:99px}
.d{font-weight:650;font-size:.85em;white-space:nowrap}.d.sube{color:var(--sube)}.d.baja{color:var(--baja)}.d.igual{color:var(--mu)}
/* Tarjetas */
.cuando{color:var(--mu);font-size:.78em;margin:-6px 0 10px;line-height:1.35}.cuando.viejo{color:#ffb454}.cuando b{font-weight:600;color:var(--tx)}.cuando.viejo b{color:#ffb454}
.rf{margin-left:6px;background:none;border:1px solid var(--bd);color:var(--mu);border-radius:8px;padding:1px 7px;font:inherit;font-size:.85em;cursor:pointer}.rf:hover{color:var(--tx)}.rf.gira{animation:gira 1s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}
.agr{background:var(--card2);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:2px 9px;font:inherit;font-size:.85em;cursor:pointer;white-space:nowrap}
#gracias{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}#gracias[hidden]{display:none}
#gracias .caja{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:10px}
#gracias textarea{min-height:110px;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card2);color:var(--tx)}
#gracias select,#gracias button{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);cursor:pointer}#gracias .botones{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}#gracias .ok{background:var(--oro);color:#111;border:0;font-weight:650}
#gracias .trad{white-space:pre-wrap;background:var(--card2);border-radius:10px;padding:10px;color:var(--mu);font-size:.92em}
.grilla{columns:360px;column-gap:12px}.grilla>.card{break-inside:avoid;margin:0 0 12px;display:block;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;min-width:0}
.card h2{font-size:1.02em;margin:0 0 10px;display:flex;gap:8px;align-items:center}.card h2 small{color:var(--mu);font-weight:400;font-size:.78em;margin-left:auto}
.card h3{font-size:.85em;color:var(--mu);font-weight:600;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.6px}
.fila{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-top:1px solid var(--bd);align-items:baseline}.fila:first-of-type{border-top:0}
.fila .n{font-weight:600;min-width:0;overflow-wrap:anywhere}.fila .n a{color:inherit;text-decoration:none}.fila .n a:hover{text-decoration:underline}
.fila .v{font-weight:700;font-size:1.08em;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.fila .v small{font-weight:400;color:var(--mu);font-size:.72em;margin-left:4px}
.fila .x{grid-column:1/-1;color:var(--mu);font-size:.84em;display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
.fila.sub .n{font-weight:400;font-size:.93em;padding-left:10px}.fila.sub .v{font-size:.98em}
.fila.alerta .v{color:var(--baja)}.fila.espera .v{color:var(--azul)}.fila.bien .v{color:var(--sube)}
.ingresos{margin-bottom:14px}.ingresos .tot{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin-bottom:6px}.ingresos .tot .v{font-size:clamp(1.7em,5vw,2.6em);font-weight:800;color:var(--oro);font-variant-numeric:tabular-nums}.ingresos .tot .s{color:var(--mu);font-size:.9em}
.portales{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px;margin-bottom:14px}.portal{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--azul);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:3px;color:inherit;text-decoration:none;min-width:0}.portal.bien{border-left-color:var(--sube)}.portal.alerta{border-left-color:var(--baja)}.portal .t{color:var(--mu);font-size:.82em}.portal .e{font-weight:750;font-size:1.1em}.portal .s{color:var(--mu);font-size:.8em;overflow-wrap:anywhere}
.prop{grid-column:1/-1;height:6px;background:var(--card2);border-radius:99px;overflow:hidden}.prop i{display:block;height:100%;background:var(--oro);border-radius:99px}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin-bottom:14px}
.app{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;min-width:0}
.app .cab{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}.app .cab b{font-size:1.08em;flex:1;min-width:0;overflow-wrap:anywhere}.app .cab a{color:inherit;text-decoration:none}.app .cab span{color:var(--oro);font-size:.9em;white-space:nowrap}
.app .plata{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}.app .plata .v{font-size:1.7em;font-weight:750;font-variant-numeric:tabular-nums}.app .plata .s{color:var(--mu);font-size:.85em}
.datos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.dato{background:var(--card2);border-radius:12px;padding:8px 10px;min-width:0}
.dato .v{font-weight:700;font-size:1.1em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dato .t{color:var(--mu);font-size:.75em;line-height:1.25}
.app .pie{color:var(--mu);font-size:.8em;margin-top:8px}
h2.titulo{font-size:1.05em;margin:6px 0 10px}
svg.graf{width:100%;height:auto;display:block}

.vacio{color:var(--mu);font-size:.9em;padding:6px 0}
/* Ingreso */
#login{max-width:360px;margin:16vh auto 0;text-align:center}#login input[type=password]{width:100%;padding:13px;font:inherit;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin:14px 0}
#login button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--oro);color:#151515;font:inherit;font-weight:750;cursor:pointer}
label.rec{display:flex;gap:8px;justify-content:center;align-items:center;color:var(--mu);font-size:.9em;margin-top:12px}
.oculto{display:none!important}
/* Más compacto */
.card,.app,.kpi{padding:11px 13px}.kpis,.apps,.portales{gap:9px;margin-bottom:10px}.grilla>.card{margin-bottom:9px}.grilla{column-gap:9px}
.kpi .v{font-size:clamp(1.3em,3.6vw,1.9em)}.app .plata .v{font-size:1.4em}.app .plata{margin-bottom:7px}
.datos{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.dato{padding:6px 8px}.dato .v{font-size:1em}
.fila{padding:7px 0}.card h2{margin-bottom:6px}
/* Período */
.rango{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:3px;gap:2px}
.rango button{background:none;border:0;color:var(--mu);font:inherit;font-size:.88em;padding:5px 10px;border-radius:9px;cursor:pointer}
.rango button.on{background:var(--oro);color:#111;font-weight:700}
/* Reordenar arrastrando */
.bloque,.grilla>.card{position:relative}
.asa{position:absolute;top:6px;right:8px;z-index:2;cursor:grab;color:var(--mu);font-size:1.05em;line-height:1;padding:4px 5px;border-radius:7px;touch-action:none;user-select:none;-webkit-user-select:none}
.asa:hover{color:var(--tx);background:var(--card2)}
.card h2 .rf{margin-right:26px}.bloque>.card h2{padding-right:26px}
.arrastrando{opacity:.92;box-shadow:0 18px 40px #000a;transform:rotate(.6deg);cursor:grabbing}
.hueco{border:2px dashed var(--oro);border-radius:var(--r);background:#ffc53d10;margin:0 0 10px;break-inside:avoid}.grilla>.hueco{margin-bottom:9px}
body.moviendo{cursor:grabbing;user-select:none;-webkit-user-select:none}
.ayuda{color:var(--mu);font-size:.75em;margin:0 0 8px}.bloque:has(>.portales:empty),.bloque:has(>.ingresos[hidden]){display:none}
@media (max-width:560px){header{flex-wrap:wrap}.rango{order:3;width:100%;justify-content:space-between}.rango button{flex:1}}
.vista{margin-left:auto;background:none;border:1px solid var(--bd);color:var(--mu);border-radius:8px;padding:1px 7px;font:inherit;font-size:.85em;cursor:pointer}.vista:hover{color:var(--tx)}.vista+.rf{margin-left:6px}.card h2 small+.vista{margin-left:6px}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82em;color:var(--mu);margin-top:4px}.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:6px 0}.hb .hn{font-weight:600;overflow-wrap:anywhere}.hb .hv{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.hb .hp{grid-column:1/-1;height:9px;background:var(--card2);border-radius:99px;overflow:hidden}.hb .hp i{display:block;height:100%;background:linear-gradient(90deg,var(--azul),#9fc4ff);border-radius:99px}
.tabla{max-height:340px;overflow:auto}.tabla table{width:100%;border-collapse:collapse;font-size:.88em;font-variant-numeric:tabular-nums}.tabla th,.tabla td{padding:5px 8px;border-top:1px solid var(--bd);text-align:right}.tabla th:first-child,.tabla td:first-child{text-align:left}.tabla th{color:var(--mu);font-weight:600;position:sticky;top:0;background:var(--card)}
</style>
</head>
<body>
<main>
  <section id="login">
    <h1>📊 Tablero VikingZone</h1>
    <form id="fLogin"><input id="clave" type="password" autocomplete="current-password" placeholder="Clave del tablero" required>
    <button>Entrar</button><label class="rec"><input type="checkbox" id="recordar" checked> Recordar en este dispositivo</label></form>
    <p id="msgLogin" class="estado"></p>
  </section>
  <section id="tablero" class="oculto">
    <header><h1>📊 VikingZone</h1><div class="rango" id="rango" role="group" aria-label="Período"><button data-r="hoy">Hoy</button><button data-r="sem">7 días</button><button data-r="mes">Mes</button></div><button class="ctrl" id="btnAct" aria-label="Actualizar">↻</button><button class="ctrl" id="btnSalir">Salir</button></header>
    <p class="estado" id="estado"></p>
    <div id="avisos"></div>
    <div id="arriba">
      <div class="bloque" data-k="kpis"><div class="cuando" id="cuandoKpis"></div><div class="kpis" id="kpis"></div></div>
      <div class="bloque" data-k="ingresos"><section class="card ingresos" id="ingresos" hidden></section></div>
      <div class="bloque" data-k="apps"><h2 class="titulo" id="tituloApps">📱 Tus apps</h2><div class="cuando" id="cuandoApps"></div><div class="apps" id="apps"></div></div>
      <div class="bloque" data-k="portales"><div class="portales" id="portales"></div></div>
    </div>
    <p class="ayuda">Arrastrá cualquier panel desde <b>⠿</b> para cambiarlo de lugar (queda guardado en este dispositivo).</p>
    <div class="grilla" id="grilla"></div>
    <div id="gracias" hidden><div class="caja">
      <b id="grQuien">Agradecer</b>
      <textarea id="grTexto" placeholder="Escribí tu mensaje en castellano. Ej.: ¡Gracias por descargar mi modelo! Si lo imprimís, me encantaría ver una foto."></textarea>
      <label>Traducir a <select id="grIdioma"><option value="en">Inglés</option><option value="es">Castellano (no traducir)</option><option value="pt">Portugués</option><option value="fr">Francés</option><option value="de">Alemán</option><option value="it">Italiano</option><option value="nl">Neerlandés</option><option value="pl">Polaco</option><option value="ja">Japonés</option><option value="zh">Chino</option><option value="ko">Coreano</option><option value="ru">Ruso</option><option value="cs">Checo</option><option value="sv">Sueco</option><option value="tr">Turco</option></select></label>
      <div class="trad" id="grTrad" hidden></div>
      <div class="botones"><button id="grCerrar">Cerrar</button><button class="ok" id="grOk">Traducir, copiar y abrir su perfil</button></div>
    </div></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const SAL = new TextEncoder().encode('vikingzone-tablero-v1');
const LS = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
const deb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)), b64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
let K = null;
async function derivar(pass) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: SAL, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function bajar() {
  const c = await (await fetch('datos.json?t=' + Date.now(), { cache: 'no-store' })).json();
  const d = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: deb64(c.iv) }, K, deb64(c.d));
  return JSON.parse(new TextDecoder().decode(d));
}
// ---------- Ayudas ----------
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const usd = n => n == null ? '—' : 'US$ ' + Number(n).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = n => n == null ? '—' : Number(n).toLocaleString('es-AR');
const hace = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? 'recién' : m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : `hace ${Math.round(m / 1440)} días`; };
// ---------- Fechas: hasta cuándo llegan los datos y cuándo se buscaron ----------
const hhmm = iso => { const d = new Date(iso); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const fh = iso => { const d = new Date(iso); return d.toLocaleDateString('es-AR', { weekday: 'short' }).replace('.', '') + ' ' + String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + ' ' + hhmm(iso); };
const diaCorto = d => { // 'AAAA-MM-DD' → hoy / ayer / dd/mm
  if (!/^\d{4}-\d{2}-\d{2}/.test(d)) return d;
  const hoy = new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10), ayer = new Date(Date.now() - 27 * 3600e3).toISOString().slice(0, 10);
  return d === hoy ? 'hoy' : d === ayer ? 'ayer' : d.slice(8, 10) + '/' + d.slice(5, 7);
};
function lineaCuando(s) {
  if (!s) return '';
  const c = s.cuando || {}, partes = [];
  if (s.viejo) partes.push(`<b>⚠ No se pudo actualizar</b>: muestra el dato del ${s.buscado ? fh(s.buscado) : 'último intento bueno'}`);
  partes.push(c.hasta === 'instante' || !c.hasta ? '<b>Al instante</b>' : `<b>Datos hasta ${diaCorto(c.hasta) === 'hoy' || diaCorto(c.hasta) === 'ayer' ? diaCorto(c.hasta) : 'el ' + diaCorto(c.hasta)}</b>`);
  if (c.periodo) partes.push(c.periodo);
  if (c.nota) partes.push(c.nota);
  if (s.buscado && !s.viejo) partes.push('buscado ' + (new Date(s.buscado).toDateString() === new Date().toDateString() ? 'hoy ' + hhmm(s.buscado) : fh(s.buscado)));
  return `<div class="cuando${s.viejo ? ' viejo' : ''}">${partes.join(' · ')}</div>`;
}
// Diferencia contra hace 7 días (o el dato más viejo que haya).
function cambio(serie, dinero) {
  if (!serie) return '';
  const ks = Object.keys(serie).sort(); if (ks.length < 2) return '';
  const ult = ks[ks.length - 1], lim = new Date(new Date(ult) - 7 * 864e5).toISOString().slice(0, 10);
  const base = ks.filter(k => k <= lim).pop() || ks[0], dif = serie[ult] - serie[base];
  const dias = Math.round((new Date(ult) - new Date(base)) / 864e5), cuando = dias >= 7 ? 'esta semana' : dias === 1 ? 'desde ayer' : `en ${dias} días`;
  if (!dif) return `<span class="d igual">= sin cambios ${cuando}</span>`;
  const txt = dinero ? usd(Math.abs(dif)) : num(Math.abs(dif));
  return `<span class="d ${dif > 0 ? 'sube' : 'baja'}">${dif > 0 ? '▲ +' : '▼ −'}${txt} ${cuando}</span>`;
}
function versus(a, b, dinero) {
  if (b == null || a == null) return '';
  const dif = a - b; if (Math.abs(dif) < 0.005) return '<span class="d igual">= igual</span>';
  return `<span class="d ${dif > 0 ? 'sube' : 'baja'}">${dif > 0 ? '▲ +' : '▼ −'}${dinero ? usd(Math.abs(dif)) : num(Math.abs(dif))}</span>`;
}
function barras(serie) {
  const W = 700, H = 210, pi = 34, pb = 26, n = serie.length, mx = Math.max(0.01, ...serie.map(x => x.gan));
  const paso = (W - pi) / n, an = paso * 0.62, alto = H - pb - 14;
  const tope = mx >= 1 ? Math.ceil(mx) : Math.ceil(mx * 100) / 100;
  let g = `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ganancia por día, últimos ${n} días">`;
  for (const f of [0, 0.5, 1]) { const y = 6 + alto * (1 - f); g += `<line x1="${pi}" x2="${W}" y1="${y}" y2="${y}" stroke="#2a2e3b"/><text x="${pi - 6}" y="${y + 4}" fill="#9299ab" font-size="12" text-anchor="end">$${(tope * f).toFixed(tope < 1 ? 2 : 0)}</text>`; }
  serie.forEach((x, i) => {
    const h = x.gan / tope * alto, xx = pi + i * paso + (paso - an) / 2, y = 6 + alto - h, hoy = i === n - 1;
    g += `<rect x="${xx}" y="${y}" width="${an}" height="${Math.max(h, x.gan ? 2 : 0)}" rx="4" fill="${hoy ? '#ffc53d' : '#6ea8ff'}"><title>${x.fecha}: ${usd(x.gan)} · ${num(x.imp)} anuncios</title></rect>`;
    if (i % 2 === (n - 1) % 2) g += `<text x="${xx + an / 2}" y="${H - 8}" fill="#9299ab" font-size="12" text-anchor="middle">${hoy ? 'hoy' : x.fecha.slice(8) + '/' + x.fecha.slice(5, 7)}</text>`;
  });
  return g + '</svg>';
}
// Gráfico de líneas (una por app) con leyenda.
const COLORES = ['#ffc53d', '#6ea8ff', '#3ecf7a', '#ff6257', '#c78bff', '#4dd4e0'];
function lineas(series, unidad) {
  const ns = Object.keys(series).filter(k => series[k] && series[k].length); if (!ns.length) return '<p class="vacio">Todavía sin datos.</p>';
  const W = 700, H = 220, pi = 34, pb = 26, n = series[ns[0]].length, mx = Math.max(1, ...ns.flatMap(k => series[k].map(x => x.n)));

  document.querySelectorAll('.rf.gira').forEach(b => b.classList.remove('gira'));
}
document.addEventListener('click', e => { const b = e.target.closest('.rf'); if (b) refrescar(b.dataset.f, b); });
// 💌 Agradecer: escribís en castellano, se traduce (traductor gratuito, sin clave), se copia y se abre el perfil en Cults3D para pegarlo.
let GR = null;
document.addEventListener('click', e => {
  const b = e.target.closest('.agr'); if (!b) return;
  GR = { nick: b.dataset.n, perfil: b.dataset.p };
  $('grQuien').textContent = '💌 Agradecer a ' + GR.nick; $('grIdioma').value = b.dataset.i || 'en'; $('grTrad').hidden = true;
  $('grTexto').value = LS.get('gracias-texto') || ''; $('gracias').hidden = false; $('grTexto').focus();
});
$('grCerrar').onclick = () => { $('gracias').hidden = true; };
$('grOk').onclick = async () => {
  const txt = $('grTexto').value.trim(), id = $('grIdioma').value; if (!txt) return;
  LS.set('gracias-texto', txt);
  const ventana = window.open('about:blank', '_blank'); // se abre ya (si no, el navegador la bloquea) y después va al perfil
  let fin = txt;
  if (id !== 'es') {
    $('grOk').textContent = 'Traduciendo…';
    try {
      const r = await (await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(txt) + '&langpair=es|' + id)).json();
      if (r.responseStatus == 200 && r.responseData?.translatedText) fin = r.responseData.translatedText; else throw new Error(r.responseDetails || 'sin respuesta');
    } catch (e) {
      $('grTrad').hidden = false; $('grTrad').textContent = 'El traductor no contestó (' + e.message + '). Te abro Google Traductor con tu texto.';
      if (ventana) ventana.location = 'https://translate.google.com/?sl=es&tl=' + id + '&text=' + encodeURIComponent(txt);
      $('grOk').textContent = 'Traducir, copiar y abrir su perfil'; return;
    }
  }
  try { await navigator.clipboard.writeText(fin); } catch (e) { }
  $('grTrad').hidden = false; $('grTrad').textContent = '✅ Copiado. Pegalo en el mensaje a ' + GR.nick + ':\n\n' + fin;
  $('grOk').textContent = 'Traducir, copiar y abrir su perfil';
  if (ventana) ventana.location = GR.perfil; else window.open(GR.perfil, '_blank');
};
$('btnSalir').onclick = () => { LS.del('tablero-k'); K = null; $('tablero').classList.add('oculto'); $('login').classList.remove('oculto'); };
document.addEventListener('visibilitychange', () => { if (!document.hidden && K) cargar(); });
setInterval(() => { if (K && !document.hidden) cargar(); }, 5 * 60000);
(async () => {
  const g = LS.get('tablero-k');
  if (g) { const k = await crypto.subtle.importKey('raw', deb64(g), 'AES-GCM', true, ['decrypt']); if (!(await entrar(k))) LS.del('tablero-k'); }
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
